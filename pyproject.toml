[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mingchaoch-tokenplan"
version = "0.1.0"
description = "按预估消耗与优先级分配预算，给出调度顺序与超限风险"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "mingchaoch" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://mingchaoch.github.io"
Repository = "https://github.com/mingchaoch/tokenplan"
Issues = "https://github.com/mingchaoch/tokenplan/issues"

[project.scripts]
tokenplan = "tokenplan:main"

[tool.setuptools]
py-modules = ["tokenplan"]
